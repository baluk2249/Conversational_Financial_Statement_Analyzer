[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-statement-analyzer"
version = "0.1.0"
description = "Grounded retrieval services for financial statement analysis"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.8,<2",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0,<5"]
semantic = ["model2vec>=0.3,<1"]
app = [
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "langgraph>=0.2,<1",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
    "pypdf>=4,<6",
    "python-multipart>=0.0.9,<1",
    "streamlit>=1.35,<2",
    "uvicorn[standard]>=0.29,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["agents*", "api*", "application*", "frontend*", "ingestion*", "llm*", "models*", "retrieval*", "finance*", "config*", "orchestration*"]

[tool.setuptools.package-data]
config = ["*.yaml"]